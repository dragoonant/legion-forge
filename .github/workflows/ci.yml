name: CI

# The repo is private (PLAN.md D6), so there is no Pages deploy yet. When it goes public, restore the Pages
# jobs from the sibling projects' deploy.yml and rewrite the README notice in the same commit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:data
      - run: npm run build
